<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ScienceX · Case Study Question Bank</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --paper:#F6F3EA;
  --paper-line:#E4DFCF;
  --ink:#1F3B2C;
  --ink-soft:#4B5F52;
  --teal:#2F6F62;
  --teal-deep:#1E4A40;
  --amber:#E3A857;
  --clay:#C1502E;
  --sage-border:#D8D2BE;
  --card:#FFFFFF;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  background-image:
    linear-gradient(var(--paper-line) 1px, transparent 1px);
  background-size: 100% 34px;
  color:var(--ink);
  font-family:'IBM Plex Sans', sans-serif;
  min-height:100vh;
}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 60px;}

/* Header */
.masthead{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px;}
.masthead h1{
  font-family:'Fraunces', serif;
  font-weight:700;
  font-size:28px;
  margin:0;
  letter-spacing:-0.01em;
}
.masthead .sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.filters select{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  padding:7px 10px;
  border:1.5px solid var(--ink);
  border-radius:3px;
  background:var(--card);
  color:var(--ink);
  cursor:pointer;
}
.filters select:focus{outline:2px solid var(--teal); outline-offset:1px;}

/* Progress */
.progressRow{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.progressTrack{flex:1;height:6px;background:var(--sage-border);border-radius:4px;overflow:hidden;}
.progressFill{height:100%;background:var(--teal);width:0%;transition:width .35s ease;}
.progressLabel{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);white-space:nowrap;}

/* Score strip */
.scoreStrip{display:flex;gap:18px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-bottom:20px;}
.scoreStrip b{color:var(--ink);}

/* Card */
.card{
  background:var(--card);
  border:1.5px solid var(--ink);
  border-radius:6px;
  padding:24px 24px 22px;
  position:relative;
  box-shadow:5px 5px 0 var(--sage-border);
}
.tag{
  position:absolute;
  top:-13px; left:20px;
  background:var(--ink);
  color:var(--paper);
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  padding:4px 10px;
  border-radius:3px;
  letter-spacing:.04em;
}
.tag.difficulty-Easy{background:var(--teal);}
.tag.difficulty-Medium{background:var(--amber); color:var(--ink);}
.tag.difficulty-Hard{background:var(--clay);}

.specimen{
  position:absolute; top:-13px; right:20px;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  background:var(--paper);
  border:1.5px solid var(--ink);
  color:var(--ink);
  padding:3px 9px;
  border-radius:3px;
}

.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--teal-deep);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 6px;}
.qtext{font-family:'Fraunces', serif; font-weight:600; font-size:19px; line-height:1.4; margin:0 0 14px;}

.qimg{max-width:100%;border:1px solid var(--sage-border);border-radius:4px;margin-bottom:16px;display:block;}

.options{display:flex;flex-direction:column;gap:9px;}
.opt{
  text-align:left;
  font-family:'IBM Plex Sans',sans-serif;
  font-size:14.5px;
  padding:11px 14px;
  border:1.5px solid var(--sage-border);
  border-radius:5px;
  background:var(--paper);
  cursor:pointer;
  transition: border-color .15s, background .15s;
  display:flex; gap:10px; align-items:flex-start;
}
.opt:hover:not(.locked){border-color:var(--teal); background:#EFF4F1;}
.opt:focus-visible{outline:2px solid var(--teal); outline-offset:1px;}
.opt .letter{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  color:var(--ink-soft);
  min-width:18px;
}
.opt.correct{border-color:var(--teal); background:#E4F1EC;}
.opt.correct .letter{color:var(--teal-deep);}
.opt.wrong{border-color:var(--clay); background:#FBEAE4;}
.opt.wrong .letter{color:var(--clay);}
.opt.locked{cursor:default;}

.feedback{
  margin-top:14px; padding:10px 12px; border-radius:5px;
  font-size:13px; font-family:'IBM Plex Sans',sans-serif; display:none;
}
.feedback.show{display:block;}
.feedback.right{background:#E4F1EC; color:var(--teal-deep); border:1px solid var(--teal);}
.feedback.wrong{background:#FBEAE4; color:var(--clay); border:1px solid var(--clay);}
.feedback .note{color:var(--ink-soft); display:block; margin-top:4px; font-size:12px;}

.controls{display:flex;justify-content:space-between;align-items:center;margin-top:20px;}
.btn{
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
  padding:10px 18px;
  border-radius:4px;
  border:1.5px solid var(--ink);
  background:var(--ink);
  color:var(--paper);
  cursor:pointer;
  letter-spacing:.03em;
}
.btn:hover{background:var(--teal-deep); border-color:var(--teal-deep);}
.btn.ghost{background:transparent;color:var(--ink);}
.btn.ghost:hover{background:var(--paper-line);}
.btn:disabled{opacity:.35; cursor:not-allowed;}

.emptyState{text-align:center; padding:60px 20px; font-family:'Fraunces',serif; font-size:18px; color:var(--ink-soft);}

.done{
  text-align:center; padding:40px 24px;
}
.done h2{font-family:'Fraunces',serif; font-size:26px; margin-bottom:6px;}
.done .bigscore{font-family:'IBM Plex Mono',monospace; font-size:44px; color:var(--teal-deep); margin:10px 0;}

@media (max-width:520px){
  .qtext{font-size:17px;}
  .card{padding:20px 16px 18px;}
}

/* ===== Animations ===== */
@keyframes cardIn{
  from{opacity:0; transform:translateY(14px) scale(.985);}
  to{opacity:1; transform:translateY(0) scale(1);}
}
@keyframes cardOut{
  from{opacity:1; transform:translateY(0) scale(1);}
  to{opacity:0; transform:translateY(-10px) scale(.98);}
}
@keyframes tagDrop{
  from{opacity:0; transform:translateY(-8px);}
  to{opacity:1; transform:translateY(0);}
}
@keyframes fadeIn{
  from{opacity:0;} to{opacity:1;}
}
@keyframes shake{
  10%,90%{transform:translateX(-1px);}
  20%,80%{transform:translateX(2px);}
  30%,50%,70%{transform:translateX(-4px);}
  40%,60%{transform:translateX(4px);}
}
@keyframes popIn{
  0%{transform:scale(.6); opacity:0;}
  60%{transform:scale(1.15); opacity:1;}
  100%{transform:scale(1);}
}
@keyframes checkDraw{
  from{stroke-dashoffset:24;}
  to{stroke-dashoffset:0;}
}
@keyframes bump{
  0%{transform:scale(1);}
  40%{transform:scale(1.35);}
  100%{transform:scale(1);}
}
@keyframes flicker{
  0%,100%{transform:scale(1) rotate(0deg);}
  50%{transform:scale(1.08) rotate(-3deg);}
}
@keyframes floatUp{
  0%{opacity:0; transform:translateY(0);}
  15%{opacity:1;}
  100%{opacity:0; transform:translateY(-46px);}
}

.card{animation: cardIn .38s cubic-bezier(.2,.7,.3,1) both;}
.card.exiting{animation: cardOut .22s ease-in both;}
.tag, .specimen{animation: tagDrop .4s .05s cubic-bezier(.2,.7,.3,1) both;}
.qimg{animation: fadeIn .5s ease .1s both;}

.progressFill{transform-origin:left;}

.opt{transition: border-color .15s, background .15s, transform .12s;}
.opt:active:not(.locked){transform:scale(.98);}
.opt.correct{animation: popIn .4s cubic-bezier(.3,.9,.4,1.3) both;}
.opt.wrong{animation: shake .4s ease both;}

.markIcon{opacity:0; margin-left:auto;}
.opt.correct .markIcon.check{opacity:1; animation: popIn .35s .1s cubic-bezier(.3,.9,.4,1.3) both;}
.opt.wrong .markIcon.cross{opacity:1; animation: popIn .35s .1s cubic-bezier(.3,.9,.4,1.3) both;}
.checkPath{stroke-dasharray:24; stroke-dashoffset:24; animation: checkDraw .35s .18s ease forwards;}

.feedback.show{animation: fadeIn .35s ease .12s both;}

.bump{animation: bump .4s ease;}
.streak-flame{
  display:inline-block; margin-left:3px;
  animation: flicker 1.1s ease-in-out infinite;
}

.floatPoint{
  position:absolute; right:18px; top:-6px;
  font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px;
  color:var(--teal-deep); pointer-events:none;
  animation: floatUp 1s ease forwards;
}

.done{animation: cardIn .5s cubic-bezier(.2,.7,.3,1) both;}
.done .bigscore{animation: popIn .5s .2s cubic-bezier(.3,.9,.4,1.3) both;}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration: 0.001s !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001s !important;
  }
}
</style>
</head>

let pool = [];
let idx = 0;
let score = 0;
let streak = 0;
let answered = false;

const fCase = document.getElementById('fCase');
const fDifficulty = document.getElementById('fDifficulty');
const fImage = document.getElementById('fImage');
const quizArea = document.getElementById('quizArea');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const scoreVal = document.getElementById('scoreVal');
const streakVal = document.getElementById('streakVal');

// Populate case filter
const cases = [...new Set(RAW_DATA.map(q=>q.case))].sort((a,b)=>a-b);
cases.forEach(c=>{
  const o = document.createElement('option');
  o.value = c; o.textContent = 'Case ' + c;
  fCase.appendChild(o);
});

function applyFilters(){
  const cv = fCase.value, dv = fDifficulty.value, iv = fImage.value;
  pool = RAW_DATA.filter(q=>{
    if(cv!=='all' && String(q.case)!==cv) return false;
    if(dv!=='all' && q.difficulty!==dv) return false;
    if(iv==='image' && !q.imgdata) return false;
    if(iv==='text' && q.imgdata) return false;
    return true;
  });
  idx = 0; score = 0; streak = 0;
  scoreVal.textContent = 0; streakVal.textContent = 0;
  render();
}

[fCase, fDifficulty, fImage].forEach(el=>el.addEventListener('change', applyFilters));

function render(){
  answered = false;
  if(pool.length===0){
    quizArea.innerHTML = '<div class="emptyState">No questions match these filters. Try a broader selection.</div>';
    progressFill.style.width='0%';
    progressLabel.textContent = '0 / 0';
    return;
  }
  if(idx >= pool.length){
    quizArea.innerHTML = `
      <div class="card done">
        <div class="eyebrow">Session complete</div>
        <h2>Nice work.</h2>
        <div class="bigscore">${score} / ${pool.length}</div>
        <button class="btn" id="restartBtn">Restart this set</button>
      </div>`;
    document.getElementById('restartBtn').onclick = ()=>{idx=0;score=0;streak=0;scoreVal.textContent=0;streakVal.textContent=0;render();};
    progressFill.style.width='100%';
    progressLabel.textContent = pool.length + ' / ' + pool.length;
    return;
  }

  const q = pool[idx];
  progressFill.style.width = (idx/pool.length*100)+'%';
  progressLabel.textContent = (idx+1) + ' / ' + pool.length;

  const opts = [['A',q.a],['B',q.b],['C',q.c],['D',q.d]];

  quizArea.innerHTML = `
    <div class="card">
      <div class="tag difficulty-${q.difficulty}">${q.difficulty}</div>
      <div class="specimen">Case ${q.case} · Q${q.qno}</div>
      <div class="eyebrow">${q.topic}</div>
      <div class="qtext">${q.q}</div>
      ${q.imgdata ? `<img class="qimg" src="${q.imgdata}" alt="Question figure">` : ''}
      <div class="options" id="optionsWrap">
        ${opts.map(([letter,text])=>`
          <button class="opt" data-letter="${letter}">
            <span class="letter">${letter}</span><span style="flex:1">${text}</span>
            <span class="markIcon check">
              <svg width="16" height="16" viewBox="0 0 16 16"><path class="checkPath" d="M3 8.5L6.3 12L13 4" fill="none" stroke="#1E4A40" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span class="markIcon cross">
              <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 2L12 12M12 2L2 12" stroke="#C1502E" stroke-width="2.2" stroke-linecap="round"/></svg>
            </span>
          </button>`).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="controls">
        <button class="btn ghost" id="skipBtn">Skip</button>
        <button class="btn" id="nextBtn" disabled>Next question →</button>
      </div>
    </div>
  `;

  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>selectAnswer(btn, q));
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>goNext());
  document.getElementById('skipBtn').addEventListener('click', ()=>goNext());
}

function goNext(){
  const card = quizArea.querySelector('.card');
  if(card){
    card.classList.add('exiting');
    setTimeout(()=>{ idx++; render(); }, 190);
  } else {
    idx++; render();
  }
}

function selectAnswer(btn, q){
  if(answered) return;
  answered = true;
  const chosen = btn.dataset.letter;
  const correct = q.ans;
  document.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('locked');
    if(o.dataset.letter === correct) o.classList.add('correct');
    if(o.dataset.letter === chosen && chosen !== correct) o.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  if(chosen === correct){
    score++; streak++;
    fb.className = 'feedback show right';
    fb.innerHTML = 'Correct.' + (q.notes ? `<span class="note">${q.notes}</span>` : '');
    showFloatPoint(btn);
  } else {
    streak = 0;
    fb.className = 'feedback show wrong';
    fb.innerHTML = `Correct answer: ${correct}.` + (q.notes ? `<span class="note">${q.notes}</span>` : '');
  }
  bumpNumber(scoreVal, score);
  bumpNumber(streakVal, streak);
  streakFlame.innerHTML = streak >= 3 ? '<span class="streak-flame">🔥</span>' : '';

  document.getElementById('nextBtn').disabled = false;
  document.getElementById('skipBtn').style.display = 'none';
}

const streakFlame = document.getElementById('streakFlame');

function bumpNumber(el, val){
  el.textContent = val;
  el.classList.remove('bump');
  void el.offsetWidth; // restart animation
  el.classList.add('bump');
}

function showFloatPoint(anchorEl){
  const card = quizArea.querySelector('.card');
  const pt = document.createElement('span');
  pt.className = 'floatPoint';
  pt.textContent = '+1';
  card.appendChild(pt);
  setTimeout(()=>pt.remove(), 1000);
}

applyFilters();
</script>
</body>
</html>
