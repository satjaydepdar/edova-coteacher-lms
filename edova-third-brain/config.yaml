# edova-third-brain top-level config

paths:
  subjects: "./subjects"
  okf_bundle: "./okf-bundle"
  logs: "./logs"
  inbox: "./inbox"
  review: "./review"

# Cloud shelf (tools/s3_push.py). Keys derive as
# <prefix>/<Subject>/Chapter-XX/<filename> and are written back into OKF nodes.
s3:
  bucket: "innuxai-edova-coteacher"
  prefix: "Class-10/Semester-01"

subjects: {}

document_types: {}

# Controlled vocabularies — edit here to extend, no code changes needed.
# Consumers fall back to these same values hardcoded if the block is absent.
taxonomy:
  # check_okf.py: bundle integrity expectations
  expected_subjects: ["math", "science", "history", "geography", "english"]
  expected_science_subdirs: ["physics", "chemistry", "biology"]
  # edova-camel grounding.py: free-form subject string -> bundle folder
  subject_keywords:
    math: ["math"]
    science: ["scien", "physic", "chem", "bio"]
  # classify.py: filename cue -> doc_type folder (first match wins)
  doc_type_cues:
    worksheet: "worksheets"
    lesson: "lesson-plans"
    mcq: "question-bank"
    question: "question-bank"
    rubric: "assessments"
    test: "assessments"
    quiz: "assessments"
    assessment: "assessments"
    activit: "activities"
    slide: "assets"
    video: "videos"
    note: "handbook"
    reflection: "handbook"
    handbook: "handbook"
  default_doc_type: "handbook"
