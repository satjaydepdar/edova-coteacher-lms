summary: >
  This chapter applies the optics of lenses to the human eye, explaining how
  its lens system forms images on the retina and how defects of vision are
  corrected with spectacles. It then studies refraction through a triangular
  prism, the dispersion of white light into the VIBGYOR spectrum, and the
  formation of rainbows. The chapter closes with atmospheric refraction and
  the scattering of light, explaining the twinkling of stars and the blue
  colour of the sky.

