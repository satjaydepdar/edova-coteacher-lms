key_concepts:
  - concept: "Electric Current (I = Q/t)"
    section: "11.1 ELECTRIC CURRENT AND CIRCUIT"
    summary: "The rate of flow of electric charge through a conductor's cross-section, measured in amperes, where one ampere equals one coulomb of charge flowing per second."

  - concept: "Electric Circuit"
    section: "11.1 ELECTRIC CURRENT AND CIRCUIT"
    summary: "A continuous and closed conducting path along which an electric current flows, typically connecting a cell, bulb, ammeter, wires, and a switch or plug key."

  - concept: "Potential Difference (V = W/Q)"
    section: "11.2 ELECTRIC POTENTIAL AND POTENTIAL DIFFERENCE"
    summary: "The work done in moving a unit charge between two points in a current-carrying circuit, measured in volts using a voltmeter always connected in parallel."

  - concept: "Ohm's Law (V = IR)"
    section: "11.4 OHM'S LAW"
    summary: "The potential difference across a metallic conductor is directly proportional to the current flowing through it, provided the temperature of the conductor remains constant throughout."

  - concept: "Resistance"
    section: "11.4 OHM'S LAW"
    summary: "A conductor's property that opposes the flow of electric charge through it, measured in ohms and determined by the ratio of applied voltage to current."

  - concept: "Resistivity (R = ρl/A)"
    section: "11.5 FACTORS ON WHICH THE RESISTANCE OF A CONDUCTOR DEPENDS"
    summary: "The characteristic resistance property of a material, such that resistance increases with conductor length and decreases with cross-sectional area, and it is measured in ohm-metres."

  - concept: "Resistors in Series"
    section: "11.6.1 Resistors in Series"
    summary: "Series connection of resistors carries identical current through every resistor, and the total equivalent resistance equals the sum of all individual resistances in the combination."

  - concept: "Resistors in Parallel"
    section: "11.6.2 Resistors in Parallel"
    summary: "Parallel connection divides the total current among branches at equal voltage; the reciprocal of the equivalent resistance equals the sum of all individual resistors' reciprocals."

  - concept: "Joule's Law of Heating (H = I²Rt)"
    section: "11.7 HEATING EFFECT OF ELECTRIC CURRENT"
    summary: "Heat produced in a resistor is directly proportional to the square of current, to its resistance, and to the time for which the current flows."

  - concept: "Electric Fuse"
    section: "11.7.1 Practical Applications of Heating Effect of Electric Current"
    summary: "A safety wire of low-melting-point alloy placed in series with appliances; it melts and breaks the circuit whenever the current exceeds its specified rated value."

  - concept: "Electric Power (P = VI)"
    section: "11.8 ELECTRIC POWER"
    summary: "The rate at which electrical energy is consumed or dissipated in a circuit, equal to voltage times current, and is measured in units of watts."

  - concept: "Kilowatt Hour"
    section: "11.8 ELECTRIC POWER"
    summary: "The commercial unit of electrical energy, equal to the energy consumed when one kilowatt of power is used for one hour, equalling 3.6 million joules."

