summary: >
  This chapter introduces electric current and the quantities that control it
  in a circuit: potential difference, resistance, and Ohm's law. It derives
  how the resistance of a conductor depends on its length, cross-sectional
  area, and material, and analyses series and parallel combinations of
  resistors. The final sections cover the heating effect of electric current,
  its practical applications including the electric fuse, electric power, and
  the kilowatt hour as the commercial unit of electrical energy.

