summary: >
  This chapter explores the optical phenomena of reflection and refraction 
  using the straight-line propagation of light. It covers the properties of 
  spherical mirrors (concave and convex), ray diagrams, the mirror formula, 
  and magnification. The latter half introduces refraction through glass slabs, 
  Snell's law, refractive index, spherical lenses, the lens formula, and the 
  concept of the power of a lens.

