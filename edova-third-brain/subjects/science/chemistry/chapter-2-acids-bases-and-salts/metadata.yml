key_concepts:
  - concept: "Acid-Base Indicators"
    section: "2.1.1 Acids and Bases in the Laboratory"
    summary: "Dyes such as litmus, turmeric, methyl orange and phenolphthalein that change colour in acidic or basic solutions, thereby indicating the chemical nature of tested substances."

  - concept: "Olfactory Indicators"
    section: "2.1.1 Acids and Bases in the Laboratory"
    summary: "Substances like onion, vanilla and clove oil whose odour changes when mixed with acidic or basic media, serving as reliable smell-based tests for identifying acids."

  - concept: "Reaction of Acids with Metals"
    section: "2.1.2 How do Acids and Bases React with Metals?"
    summary: "Active metals like zinc displace hydrogen from dilute acids, forming a corresponding salt while releasing hydrogen gas that burns with a characteristic pop sound nearby."

  - concept: "Reaction of Bases with Metals"
    section: "2.1.2 How do Acids and Bases React with Metals?"
    summary: "Some bases react with certain metals such as zinc forming a salt like sodium zincate, evolving hydrogen gas, though such reactions are impossible with metals."

  - concept: "Metal Carbonates with Acids"
    section: "2.1.3 How do Metal Carbonates and Metal Hydrogencarbonates React with Acids?"
    summary: "All metal carbonates and hydrogencarbonates react with acids producing a corresponding salt, carbon dioxide gas and water; the evolved carbon dioxide turns lime water milky."

  - concept: "Neutralisation Reaction"
    section: "2.1.4 How do Acids and Bases React with each other?"
    summary: "The reaction between an acid and a base producing salt and water, where each cancels out the other's effect, is known as a neutralisation reaction."

  - concept: "Metallic Oxides with Acids"
    section: "2.1.5 Reaction of Metallic Oxides with Acids"
    summary: "Metallic oxides react with acids to form salt and water, resembling bases in their behaviour, so metallic oxides like copper oxide are called basic oxides."

  - concept: "Non-metallic Oxides with Bases"
    section: "2.1.6 Reaction of a Non-metallic Oxide with Base"
    summary: "Non-metallic oxides such as carbon dioxide react with bases like calcium hydroxide to produce salt and water, showing that non-metallic oxides are acidic in nature."

  - concept: "Hydrogen Ions from Acids"
    section: "2.2 WHAT DO ALL ACIDS AND ALL BASES HAVE IN COMMON?"
    summary: "All acids generate hydrogen ions in aqueous solution, and these ions carry electric current through the solution, being responsible for the characteristic acidic properties shown."

  - concept: "Hydronium Ion Formation"
    section: "2.2.1 What Happens to an Acid or a Base in a Water Solution?"
    summary: "Hydrogen ions cannot exist independently; they combine with water molecules forming hydronium ions, which explains why dry hydrogen chloride gas shows no acidic behaviour whatsoever."

  - concept: "Alkalis"
    section: "2.2.1 What Happens to an Acid or a Base in a Water Solution?"
    summary: "Bases that dissolve in water are called alkalis; they generate hydroxide ions in solution, feel soapy to touch, taste bitter and are corrosive in nature."

  - concept: "Dilution of Acids and Bases"
    section: "2.2.1 What Happens to an Acid or a Base in a Water Solution?"
    summary: "Dissolving a concentrated acid or base in water is a highly exothermic process; always add the acid slowly to water with constant stirring for safety."

  - concept: "Universal Indicator and pH Scale"
    section: "2.3 HOW STRONG ARE ACID OR BASE SOLUTIONS?"
    summary: "A universal indicator shows different colours at different hydrogen ion concentrations; the pH scale measuring this concentration generally ranges from zero up to fourteen overall."

  - concept: "Strong and Weak Acids"
    section: "2.3 HOW STRONG ARE ACID OR BASE SOLUTIONS?"
    summary: "Strength depends on the number of hydrogen or hydroxide ions produced; acids giving rise to more hydrogen ions are strong, while others are weak acids."

  - concept: "pH in Everyday Life"
    section: "2.3.1 Importance of pH in Everyday Life"
    summary: "Living organisms survive only within narrow pH ranges; acid rain, soil pH for plants, digestion, tooth decay and animal stings all involve acidity and pH."

  - concept: "Family of Salts"
    section: "2.4.1 Family of Salts"
    summary: "Salts sharing the same positive or negative radicals are said to belong to one family, such as sodium salts or chloride salts, identified from formulae."

  - concept: "pH of Salts"
    section: "2.4.2 pH of Salts"
    summary: "Salts of strong acids and strong bases are neutral, while salts of strong acids with weak bases are acidic, and vice versa for strong bases."

  - concept: "Chlor-alkali Process"
    section: "2.4.3 Chemicals from Common Salt"
    summary: "Electricity passed through brine decomposes it into sodium hydroxide, with chlorine gas released at the anode and hydrogen gas at the cathode, all useful products."

  - concept: "Bleaching Powder"
    section: "2.4.3 Chemicals from Common Salt"
    summary: "Produced by the action of chlorine on dry slaked lime, bleaching powder is used for bleaching cotton and wood pulp, as oxidising agent and disinfectant."

  - concept: "Baking Soda"
    section: "2.4.3 Chemicals from Common Salt"
    summary: "Sodium hydrogencarbonate, prepared using sodium chloride as one raw material, is a mild non-corrosive basic salt used in baking powder, antacids and soda-acid fire extinguishers."

  - concept: "Washing Soda"
    section: "2.4.3 Chemicals from Common Salt"
    summary: "Sodium carbonate decahydrate, obtained by recrystallisation of sodium carbonate, is a basic salt used in glass, soap and paper industries and for removing water hardness."

  - concept: "Water of Crystallisation"
    section: "2.4.4 Are the Crystals of Salts really Dry?"
    summary: "The fixed number of water molecules present in one formula unit of a salt; heating blue hydrated copper sulphate removes this water, turning it white."

  - concept: "Plaster of Paris"
    section: "2.4.4 Are the Crystals of Salts really Dry?"
    summary: "Calcium sulphate hemihydrate, obtained by heating gypsum at three hundred seventy-three kelvin, sets into a hard solid mass with water, supporting fractured bones as plaster."

