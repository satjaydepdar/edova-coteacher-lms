summary: >
  This chapter introduces the chemical properties of acids and bases, covering
  their reactions with metals, metal carbonates and hydrogencarbonates, and
  with each other through neutralisation. It explains that acids produce
  hydrogen ions and bases produce hydroxide ions in aqueous solution, and
  presents the pH scale for measuring how strong an acid or base is, along
  with the importance of pH in everyday life. The chapter then examines
  salts, their families and pH, the manufacture of sodium hydroxide,
  bleaching powder, baking soda and washing soda from common salt, and
  finishes with water of crystallisation, gypsum and Plaster of Paris.

