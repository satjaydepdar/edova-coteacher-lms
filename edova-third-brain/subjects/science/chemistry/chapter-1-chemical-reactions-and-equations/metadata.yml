summary: >
  This chapter introduces chemical reactions and how they are recognised
  through changes in state, colour, temperature, or gas evolution. It explains
  how to write and balance chemical equations using symbols, formulae, and
  physical state notations. The chapter classifies reactions into combination,
  decomposition, displacement, double displacement, and redox types with
  everyday examples. Finally, it discusses the effects of oxidation reactions
  in daily life, namely corrosion of metals and rancidity of food.

