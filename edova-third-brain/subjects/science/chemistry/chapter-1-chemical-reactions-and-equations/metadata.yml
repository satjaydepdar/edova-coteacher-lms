key_concepts:
  - concept: "Word-Equation: Reactants and Products"
    section: "1.1 CHEMICAL EQUATIONS"
    summary: "A word-equation briefly shows reactants converting into products through an arrow; reactants appear on the left-hand side while newly formed products appear on the right."

  - concept: "Skeletal Chemical Equation"
    section: "1.1.1 Writing a Chemical Equation"
    summary: "An unbalanced chemical equation where the number of atoms of each element differs between reactants and products, making the total mass unequal on both sides."

  - concept: "Law of Conservation of Mass"
    section: "1.1.2 Balanced Chemical Equations"
    summary: "Mass can neither be created nor destroyed during any chemical reaction, so the total number of atoms of each element stays identical before and after."

  - concept: "Hit-and-Trial Method of Balancing"
    section: "1.1.2 Balanced Chemical Equations"
    summary: "A stepwise balancing technique using the smallest whole-number coefficients, starting from the compound containing maximum atoms, without ever altering the chemical formulae of reacting substances."

  - concept: "Symbols of Physical States"
    section: "1.1.2 Balanced Chemical Equations"
    summary: "Notations like (g), (l), (aq), and (s) written beside chemical formulae indicate gaseous, liquid, aqueous, and solid states of the reactants and the products respectively."

  - concept: "Combination Reaction"
    section: "1.2.1 Combination Reaction"
    summary: "A reaction in which two or more reactants, elements or compounds, combine together chemically to form a single new product, for example calcium hydroxide formation."

  - concept: "Exothermic Reactions"
    section: "1.2.1 Combination Reaction"
    summary: "Reactions that release heat energy along with the formation of products, making the reaction mixture warm; examples include burning natural gas and the process respiration."

  - concept: "Decomposition Reaction"
    section: "1.2.2 Decomposition Reaction"
    summary: "A reaction where one single reactant breaks down into two or more simpler products, such as ferrous sulphate crystals decomposing upon strong heating in laboratories."

  - concept: "Thermal Decomposition"
    section: "1.2.2 Decomposition Reaction"
    summary: "A decomposition reaction carried out specifically by heating, such as limestone breaking into quick lime and carbon dioxide in various important large-scale industrial manufacturing processes."

  - concept: "Endothermic Reactions"
    section: "1.2.2 Decomposition Reaction"
    summary: "Reactions that absorb energy from the surroundings while proceeding; decomposition reactions generally require heat, light, or electricity for breaking down their reactant molecules into products."

  - concept: "Displacement Reaction"
    section: "1.2.3 Displacement Reaction"
    summary: "A reaction where a more reactive element displaces or removes a less reactive element from its compound, like iron displacing copper from copper sulphate solution."

  - concept: "Double Displacement Reaction"
    section: "1.2.4 Double Displacement Reaction"
    summary: "Reactions involving a mutual exchange of ions between two reactants, forming two new compounds, as when sodium sulphate reacts with barium chloride in aqueous solutions."

  - concept: "Precipitation Reaction"
    section: "1.2.4 Double Displacement Reaction"
    summary: "Any reaction that produces an insoluble solid substance called a precipitate, for example white barium sulphate formed when sulphate ions meet barium ions in solution."

  - concept: "Oxidation and Reduction (Redox Reactions)"
    section: "1.2.5 Oxidation and Reduction"
    summary: "A substance gaining oxygen or losing hydrogen is oxidised, while one losing oxygen or gaining hydrogen is reduced; both changes always occur together during reactions."

  - concept: "Corrosion"
    section: "1.3.1 Corrosion"
    summary: "The slow process where a metal is attacked by surrounding substances like moisture or acids, forming unwanted coatings such as reddish brown rust on iron."

  - concept: "Rancidity"
    section: "1.3.2 Rancidity"
    summary: "The oxidation of fats and oils in food materials left exposed for long periods, changing their smell and taste; antioxidants help prevent this spoilage process."

