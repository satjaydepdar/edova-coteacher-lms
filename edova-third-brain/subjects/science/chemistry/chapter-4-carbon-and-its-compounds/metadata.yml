summary: >
  This chapter introduces covalent bonding in carbon, showing how the sharing of
  electrons produces single, double and triple bonds and the allotropes diamond,
  graphite and fullerenes. It explains how tetravalency and catenation give rise
  to chains, branches and rings, saturated and unsaturated hydrocarbons,
  functional groups, homologous series and the nomenclature of carbon compounds.
  The chemical properties of carbon compounds - combustion, oxidation, addition
  and substitution reactions - are then studied, followed by the properties of
  ethanol and ethanoic acid. The chapter closes with the cleansing action of
  soaps and detergents and the behaviour of soap in hard water.

