summary: >
  This chapter classifies elements as metals and non-metals on the basis of their
  physical and chemical properties. It examines metallic lustre, malleability,
  ductility, sonority and conductivity, then studies reactions of metals with
  oxygen, water, acids and salt solutions to build the reactivity series. It
  explains the formation and properties of ionic compounds, the occurrence of
  metals as minerals and ores, and extraction methods including roasting,
  calcination, the thermit reaction, electrolytic reduction and refining. It
  concludes with corrosion, the conditions for rusting, prevention methods such
  as galvanisation, and the nature and uses of alloys.

