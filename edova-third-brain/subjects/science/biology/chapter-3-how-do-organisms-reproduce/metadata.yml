summary: >
  This chapter explains why organisms reproduce and how DNA copying with
  variations drives both reproduction and evolution. It surveys the asexual
  modes used by single organisms, namely fission, fragmentation, regeneration,
  budding, vegetative propagation and spore formation, before turning to
  sexual reproduction. The significance of the sexual mode, reproduction in
  flowering plants including pollination and fertilisation, and the human
  male and female reproductive systems are covered in detail. The chapter
  closes with puberty, menstruation, reproductive health, sexually
  transmitted diseases and contraception.

