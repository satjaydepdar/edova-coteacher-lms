summary: >
  This chapter explains how variations arise during reproduction and are
  inherited across successive generations. It presents Mendel's classic
  garden pea experiments, introducing dominant and recessive traits, F1
  and F2 generations, and the independent inheritance of separate traits.
  It then explains how genes on chromosomes control traits through protein
  production, with germ cells carrying single gene sets. Finally, it covers
  sex determination, showing how the X and Y chromosomes inherited from
  parents decide the sex of human children.

