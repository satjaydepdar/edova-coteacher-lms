summary: >
  This chapter explains how control and coordination are achieved in living
  organisms. It describes the animal nervous system, covering receptors,
  neurons, synapses, reflex arcs, the structure and functions of the human
  brain, and how nervous tissue causes muscle action. It then examines
  coordination in plants, including immediate responses to stimuli, tropic
  growth movements, and plant hormones such as auxin. Finally, it discusses
  hormones in animals, the endocrine glands, and feedback mechanisms.

