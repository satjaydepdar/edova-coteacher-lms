key_concepts:
  - concept: "Receptors and Sense Organs"
    section: "6.1 ANIMALS – NERVOUS SYSTEM"
    summary: "Specialised tips of nerve cells located in sense organs detect all information from the environment; gustatory receptors detect taste while olfactory receptors detect smell effectively."

  - concept: "Neuron and Nerve Impulse"
    section: "6.1 ANIMALS – NERVOUS SYSTEM"
    summary: "Information acquired at dendritic tips sets off a chemical reaction creating an electrical impulse that travels from dendrite to cell body and along the axon."

  - concept: "Synapse"
    section: "6.1 ANIMALS – NERVOUS SYSTEM"
    summary: "At the axon end, the electrical impulse triggers release of chemicals that cross the gap called synapse, starting a similar impulse in the next neuron."

  - concept: "Reflex Action and Reflex Arc"
    section: "6.1.1 What happens in Reflex Actions?"
    summary: "A reflex arc connects input nerves detecting danger with output nerves moving muscles within the spinal cord, enabling quick responses without waiting for brain processing."

  - concept: "Central and Peripheral Nervous Systems"
    section: "6.1.2 Human Brain"
    summary: "The brain and spinal cord together constitute the central nervous system, while cranial and spinal nerves form the peripheral nervous system facilitating overall body-wide communication."

  - concept: "Fore-brain"
    section: "6.1.2 Human Brain"
    summary: "The fore-brain is the main thinking part, with separate sensory areas for hearing, smell, and sight, plus association areas interpreting information and directing motor responses."

  - concept: "Medulla and Involuntary Actions"
    section: "6.1.2 Human Brain"
    summary: "Many involuntary actions such as blood pressure regulation, salivation, and vomiting are controlled by the medulla located in the hind-brain region of the human brain."

  - concept: "Cerebellum"
    section: "6.1.2 Human Brain"
    summary: "The cerebellum, part of the hind-brain, is responsible for precision of voluntary actions and for maintaining the posture and balance of the whole body overall."

  - concept: "Protection of Brain and Spinal Cord"
    section: "6.1.3 How are these Tissues protected?"
    summary: "The brain sits inside a bony box and is contained within a fluid-filled balloon for shock absorption, while the vertebral column protects the spinal cord."

  - concept: "Muscle Cell Action"
    section: "6.1.4 How does the Nervous Tissue cause Action?"
    summary: "Muscle cells contain special proteins that change both shape and arrangement in response to nervous electrical impulses, giving muscle cells a shorter form during contraction."

  - concept: "Types of Plant Movements"
    section: "6.2 COORDINATION IN PLANTS"
    summary: "Plants show two different types of movement: one dependent on growth, like directional seedling movement, and another independent of growth, like rapidly folding sensitive-plant leaves."

  - concept: "Immediate Response in Sensitive Plants"
    section: "6.2.1 Immediate Response to Stimulus"
    summary: "Plants use electrical-chemical means to convey touch information between cells without specialised tissue, and cells change shape by changing the amount of water in them."

  - concept: "Tropic Movements"
    section: "6.2.2 Movement Due to Growth"
    summary: "Directional growth movements toward or away from stimuli are called tropic movements; shoots bend towards light showing phototropism, while roots grow downward clearly showing geotropism."

  - concept: "Auxin"
    section: "6.2.2 Movement Due to Growth"
    summary: "Auxin, synthesised at shoot tips, diffuses towards the shady side when light comes from one side, stimulating cells to grow longer, bending shoots towards light."

  - concept: "Other Plant Hormones"
    section: "6.2.2 Movement Due to Growth"
    summary: "Gibberellins help in stem growth like auxins, cytokinins promote cell division in fruits and seeds, while abscisic acid inhibits growth and causes wilting of leaves."

  - concept: "Adrenaline and the Endocrine System"
    section: "6.3 HORMONES IN ANIMALS"
    summary: "Adrenaline, secreted from adrenal glands, prepares the body for fighting or running by increasing heart rate, diverting blood to skeletal muscles, and raising breathing rate."

  - concept: "Thyroxin and Goitre"
    section: "6.3 HORMONES IN ANIMALS"
    summary: "Thyroxin, made by the thyroid gland using iodine, regulates carbohydrate, protein, and fat metabolism for balanced growth; iodine deficiency can cause goitre with swollen neck."

  - concept: "Growth Hormone"
    section: "6.3 HORMONES IN ANIMALS"
    summary: "Growth hormone, secreted by the pituitary gland, regulates growth and development of the body; its deficiency during childhood leads to dwarfism, while excess causes gigantism."

  - concept: "Sex Hormones and Puberty"
    section: "6.3 HORMONES IN ANIMALS"
    summary: "Testosterone in males and oestrogen in females are sex hormones whose secretion during ten to twelve years of age causes dramatic changes associated with puberty."

  - concept: "Insulin and Diabetes"
    section: "6.3 HORMONES IN ANIMALS"
    summary: "Insulin, produced by the pancreas, helps regulate blood sugar levels; when not secreted in proper amounts, blood sugar rises causing the harmful effects of diabetes."

  - concept: "Feedback Mechanism"
    section: "6.3 HORMONES IN ANIMALS"
    summary: "The timing and amount of hormone released are regulated by feedback mechanisms; rising blood sugar triggers more insulin secretion, which reduces as sugar levels fall."

