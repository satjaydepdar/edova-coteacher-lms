summary: >
  This chapter examines the essential life processes — nutrition, respiration,
  transportation, and excretion — that maintain order within living organisms.
  It explains autotrophic and heterotrophic nutrition, photosynthesis, human
  digestion, aerobic and anaerobic respiration, and the human respiratory
  system. It then describes circulation in human beings and transport in
  plants through xylem and phloem. Finally it covers excretion in human
  beings via nephrons and the varied waste-removal strategies of plants.

