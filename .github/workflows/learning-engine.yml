name: learning-engine

on:
  push:
    paths:
      - 'edova-interactive-learning-engine/**'
      - '.github/workflows/learning-engine.yml'
  pull_request:
    paths:
      - 'edova-interactive-learning-engine/**'

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edova-interactive-learning-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edova-interactive-learning-engine/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
